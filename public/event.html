<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>oidc-webpush</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }
    .detail-card {
      width: 100%;
      max-width: 520px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
    }
    .detail-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--fg-dim);
      margin-bottom: 16px;
    }
    .detail-field {
      margin-bottom: 16px;
    }
    .detail-field label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-faint);
      margin-bottom: 4px;
    }
    .detail-field .value {
      font-size: 14px;
      color: var(--fg);
      word-break: break-all;
    }
    .detail-body {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--fg);
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 24px;
    }
    .detail-actions {
      display: flex;
      gap: 12px;
    }
    .detail-actions button { flex: 1; }
    .detail-error {
      text-align: center;
      color: var(--err);
      font-family: var(--mono);
      font-size: 14px;
    }
    .detail-done {
      text-align: center;
      color: var(--ok);
      font-family: var(--mono);
      font-size: 14px;
    }
    .delivery-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-family: var(--mono);
      font-size: 11px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .delivery-row:last-child { border-bottom: 0; }
    .delivery-ua { color: var(--fg-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .delivery-status-ok  { color: var(--ok); }
    .delivery-status-err { color: var(--err); }
    .detail-section-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--fg-faint);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="detail-card" id="detail-card">
    <div class="detail-label" id="status-label">loading…</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const eventId = params.get('id');
    const card = document.getElementById('detail-card');

    function escapeRegex(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]),
      );
    }

    async function loadEvent() {
      try {
        let res;
        try {
          res = await fetch(`/api/events/${eventId}`, { credentials: 'include' });
        } catch (fetchErr) {
          card.innerHTML = '<div class="detail-error">fetch error: ' + esc(fetchErr.message) + '</div>';
          return;
        }
        if (res.status === 401 || res.status === 403) {
          card.innerHTML = '<div class="detail-error">session expired — <a href="/" style="color:var(--accent)">sign in</a></div>';
          return;
        }
        if (!res.ok) {
          let errText = 'unknown error';
          try { errText = await res.text(); } catch (e) { /* ignore */ }
          card.innerHTML = '<div class="detail-error">not found (' + res.status + ')</div>';
          return;
        }

        let ev;
        try {
          ev = await res.json();
        } catch (jsonErr) {
          card.innerHTML = '<div class="detail-error">invalid response</div>';
          return;
        }

        try {
          card.innerHTML = `
            <div class="detail-label">${esc(new Date(ev.ts).toLocaleString())}</div>
            <div class="detail-field">
              <label>from</label>
              <div class="value">${esc(ev.from_addr)}</div>
            </div>
            <div class="detail-field">
              <label>to</label>
              <div class="value">${esc(ev.to_addr)}</div>
            </div>
            <div class="detail-field">
              <label>subject</label>
              <div class="value">${esc(ev.subject)}</div>
            </div>
            <div class="detail-body">${esc(ev.body || '(no body)')}</div>
            ${ev.deliveries && ev.deliveries.length ? `
            <div class="detail-field" style="margin-bottom:24px">
              <div class="detail-section-label">delivery</div>
              ${ev.deliveries.map(d => `
                <div class="delivery-row">
                  <span class="delivery-ua">${esc(d.user_agent || 'unknown device')}</span>
                  <span class="${d.status === 'delivered' ? 'delivery-status-ok' : 'delivery-status-err'}">${esc(d.status)}${d.status_code ? ' ' + d.status_code : ''}</span>
                </div>`).join('')}
            </div>` : ''}
            <div class="detail-actions">
              <button class="primary" id="mute-btn">mute sender</button>
              <button class="ghost" id="dismiss-btn">dismiss</button>
            </div>
          `;
        } catch (htmlErr) {
          card.innerHTML = '<div class="detail-error">render error</div>';
          return;
        }

        document.getElementById('mute-btn').addEventListener('click', async () => {
          try {
            const muteRes = await fetch('/api/rules', {
              credentials: 'include',
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                match_field: 'from',
                match_pattern: '^' + escapeRegex(ev.from_addr) + '$',
                action: 'mute',
                enabled: true,
              }),
            });
            if (!muteRes.ok) throw new Error('unauthorized');
            card.innerHTML = '<div class="detail-done">muted ' + esc(ev.from_addr) + '</div>';
            setTimeout(() => { window.location.href = '/'; }, 1500);
          } catch (muteErr) {
            card.innerHTML = '<div class="detail-error">failed to mute — try from the app</div>';
          }
        });

        document.getElementById('dismiss-btn').addEventListener('click', () => {
          window.close();
          window.location.href = '/';
        });
      } catch (err) {
        card.innerHTML = '<div class="detail-error">failed to load: ' + esc(err.message) + '</div>';
      }
    }

    if (!eventId) {
      card.innerHTML = '<div class="detail-error">missing event id</div>';
    } else {
      loadEvent();
    }
  </script>
</body>
</html>
