<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>notify</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/[email protected]" defer></script>
  <script src="/client.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-name">notify</span>
      <span class="brand-host" id="brand-host"></span>
    </div>
    <div class="bar-right">
      <span id="who" class="who"></span>
      <form action="/auth/logout" method="post"><button class="ghost" type="submit">sign out</button></form>
    </div>
  </header>

  <main>
    <section class="card">
      <header class="card-h">
        <h2>devices</h2>
        <button id="enable-btn" class="primary">enable on this device</button>
      </header>
      <div id="devices" hx-get="/api/devices" hx-trigger="load" hx-swap="innerHTML">
        <div class="empty">loading…</div>
      </div>
    </section>

    <section class="card">
      <header class="card-h">
        <h2>rules</h2>
        <button class="ghost" onclick="document.getElementById('rule-form').classList.toggle('open')">+ add rule</button>
      </header>

      <form id="rule-form"
            class="rule-form"
            hx-post="/api/rules"
            hx-target="#rules"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful){this.reset();this.classList.remove('open')}">
        <select name="match_field" required>
          <option value="subject">subject</option>
          <option value="from">from</option>
          <option value="body">body</option>
        </select>
        <span class="op">~</span>
        <input name="match_pattern" placeholder="/regex/ or substring" required>
        <span class="op">→</span>
        <select name="action" required onchange="document.getElementById('rule-value').style.display=this.value==='mute'?'none':''">
          <option value="priority">priority</option>
          <option value="mute">mute</option>
          <option value="tag">tag</option>
        </select>
        <input id="rule-value" name="action_value" placeholder="value (e.g. 5)">
        <button type="submit" class="primary">save</button>
      </form>

      <div id="rules" hx-get="/api/rules" hx-trigger="load" hx-swap="innerHTML">
        <div class="empty">loading…</div>
      </div>
    </section>

    <section class="card">
      <header class="card-h">
        <h2>events</h2>
        <div class="card-actions">
          <button class="ghost" hx-post="/api/test" hx-target="#toast" hx-swap="innerHTML">test push</button>
          <button class="ghost" hx-get="/api/events" hx-target="#events" hx-swap="innerHTML">refresh</button>
        </div>
      </header>
      <div id="toast" class="toast-slot"></div>
      <div id="events"
           hx-get="/api/events"
           hx-trigger="load, every 15s"
           hx-swap="innerHTML">
        <div class="empty">loading…</div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>self-hosted · web push via VAPID · sso via authentik</span>
  </footer>
</body>
</html>
