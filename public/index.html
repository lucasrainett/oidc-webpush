<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>oidc-webpush</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/client.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-name">oidc-webpush</span>
      <span class="brand-host" id="brand-host"></span>
    </div>
    <div class="bar-right">
      <span id="who" class="who"></span>
      <form action="/auth/logout" method="post"><button class="ghost" type="submit">sign out</button></form>
    </div>
  </header>

  <main>
    <!-- Admin impersonation banner -->
    <div id="impersonate-banner" class="impersonate-banner" style="display:none">
      <span>Viewing as <span id="impersonate-name"></span></span>
      <button class="ghost" id="stop-impersonate">return to admin view</button>
    </div>

    <!-- Admin user selector -->
    <section class="card admin-only" id="admin-user-card" style="display:none">
      <header class="card-h">
        <h2>admin</h2>
        <select id="impersonate-select" class="admin-select">
          <option value="">view as user...</option>
        </select>
      </header>
    </section>

    <section class="card">
      <header class="card-h">
        <h2>devices</h2>
        <button id="enable-btn" class="primary">enable on this device</button>
      </header>
      <div id="devices"><div class="empty">loading…</div></div>
    </section>

    <section class="card">
      <header class="card-h">
        <h2>rules</h2>
        <button class="ghost" id="toggle-rule-form">+ add rule</button>
      </header>

      <form id="rule-form" class="rule-form">
        <select name="match_field" required>
          <option value="subject">subject</option>
          <option value="from">from</option>
          <option value="body">body</option>
        </select>
        <span class="op">~</span>
        <input name="match_pattern" placeholder="/regex/ or substring" required>
        <span class="op">→</span>
        <select name="action" required id="rule-action">
          <option value="priority">priority</option>
          <option value="mute">mute</option>
          <option value="tag">tag</option>
        </select>
        <input id="rule-value" name="action_value" placeholder="value (e.g. 5)">
        <select id="rule-app-name" name="app_name">
          <option value="">app (optional)</option>
        </select>
        <label class="checkbox-label"><input type="checkbox" name="enabled" checked> enabled</label>
        <button type="submit" class="primary">save</button>
      </form>

      <div id="rules"><div class="empty">loading…</div></div>
    </section>

    <section class="card">
      <header class="card-h">
        <h2>events</h2>
        <div class="card-actions">
          <select id="events-cred-filter" class="admin-select">
            <option value="">all sources</option>
          </select>
          <button class="ghost" id="test-push">test push</button>
          <button class="ghost" id="refresh-events">refresh</button>
        </div>
      </header>
      <div id="toast" class="toast-slot"></div>
      <div id="events" class="events-scroll"><div class="empty">loading…</div></div>
    </section>

    <!-- Admin: SMTP Credentials -->
    <section class="card admin-only" id="admin-credentials-card" style="display:none">
      <header class="card-h">
        <h2>smtp credentials</h2>
        <button class="ghost" id="toggle-cred-form">+ add credential</button>
      </header>
      <div class="row" style="background:var(--bg-row); border-bottom:1px solid var(--border);">
        <span class="device-ua">smtp endpoint</span>
        <code class="mono" id="smtp-endpoint"></code>
        <span class="meta">auth required · no tls</span>
      </div>
      <form id="cred-form" class="rule-form">
        <input id="cred-name" placeholder="credential name (e.g. Proxmox)" required>
        <button type="submit" class="primary">create</button>
      </form>
      <div id="cred-result" style="display:none">
        <div class="row">
          <span class="device-ua">username</span>
          <code id="cred-result-id" class="mono"></code>
          <button class="ghost" id="copy-cred-id">copy</button>
        </div>
        <div class="row">
          <span class="device-ua">password</span>
          <code id="cred-result-pass" class="mono"></code>
          <button class="ghost" id="copy-cred-pass">copy</button>
        </div>
        <div class="row" style="border:0">
          <span class="meta">copy these now — they will not be shown again</span>
          <button class="ghost" id="hide-cred-result">done</button>
        </div>
      </div>
      <div id="credentials-list"><div class="empty">loading…</div></div>
    </section>

    <!-- Admin: Unmatched Events -->
    <section class="card admin-only" id="admin-unmatched-card" style="display:none">
      <header class="card-h">
        <h2>unmatched events</h2>
        <button class="ghost" id="refresh-unmatched">refresh</button>
      </header>
      <div id="unmatched-events"><div class="empty">loading…</div></div>
    </section>
  </main>

  <footer class="foot">
    <span>self-hosted · web push via VAPID · sso via OIDC</span>
  </footer>
</body>
</html>
