<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>Notification</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }
    .note-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 28px;
      text-align: center;
    }
    .note-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--fg-dim);
      margin-bottom: 16px;
    }
    .note-from {
      font-size: 18px;
      color: var(--fg);
      margin-bottom: 8px;
      word-break: break-all;
    }
    .note-hint {
      font-size: 13px;
      color: var(--fg-faint);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .note-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .note-actions button { flex: 1; }
    .note-done {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--ok);
    }
  </style>
</head>
<body>
  <div class="note-card" id="note-card">
    <div class="note-label">New alert</div>
    <div class="note-from" id="note-from">...</div>
    <div class="note-hint">mute this sender to stop receiving these alerts</div>
    <div class="note-actions" id="note-actions">
      <button class="primary" id="mute-btn">mute</button>
      <button class="ghost" id="dismiss-btn">dismiss</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const from = params.get('from') || 'unknown';
    document.getElementById('note-from').textContent = from;

    function escapeRegex(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    document.getElementById('mute-btn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/rules', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            match_field: 'from',
            match_pattern: '^' + escapeRegex(from) + '$',
            action: 'mute',
            enabled: true,
          }),
        });
        if (!res.ok) throw new Error('unauthorized');
        const card = document.getElementById('note-card');
        card.innerHTML = '<div class="note-done">muted ' + from + '</div>';
        setTimeout(() => { window.location.href = '/'; }, 1200);
      } catch {
        document.getElementById('note-card').innerHTML = '<div class="note-done" style="color:var(--err)">session expired — sign in and try again</div><br><a href="/" class="primary" style="display:inline-block;margin-top:16px;text-decoration:none;">go to app</a>';
      }
    });

    document.getElementById('dismiss-btn').addEventListener('click', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
